<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}">
  {%- feed_meta -%}
  {%- seo -%}
  {%- if site.google_analytics -%}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {%- endif -%}
</head>
<body>
  <div class="terminal">
    <div class="titlebar">
      <span class="dot dot--red"></span>
      <span class="dot dot--amber"></span>
      <span class="dot dot--green"></span>
      <span class="titlebar__name">{{ site.title | default: 'colin.bot' }} &mdash; ~/blog &mdash; zsh</span>
    </div>

    <header class="masthead">
      <a class="prompt" href="{{ '/' | relative_url }}"><span class="prompt__sigil">colin@bot</span><span class="prompt__path">:~$</span> whoami</a>
      <p class="masthead__tagline">{{ site.description | strip_newlines }}</p>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}">home</a>
        <a href="{{ '/about/' | relative_url }}">about</a>
        <a href="https://github.com/cybercdh">github</a>
        <a href="{{ '/feed.xml' | relative_url }}">rss</a>
      </nav>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="footer">
      <span class="footer__cursor">colin@bot:~$</span>
      <a href="{{ '/' | relative_url }}">home</a> /
      <a href="{{ '/about/' | relative_url }}">about</a> /
      <a href="https://github.com/cybercdh">github</a>
      <span class="footer__blink">&#9608;</span>
    </footer>
  </div>
</body>
</html>
